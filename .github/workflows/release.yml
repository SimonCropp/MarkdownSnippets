name: release
on:
  push:
    tags: ['*']
jobs:
  publish:
    # Windows, matching build.yml (the test suite includes net48 targets).
    runs-on: windows-latest
    permissions:
      contents: read
      # Lets the job mint the OIDC token nuget.org trades for a short-lived publishing key.
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The tag is the version: tag 1.2.3 (or v1.2.3) publishes 1.2.3. The Version in
      # Directory.Build.props is only what local builds get.
      - name: Resolve the version from the tag
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # Packages are generated on build into nugets/.
      - name: Build
        run: dotnet build src --configuration Release -p:Version=${{ env.version }}
      - name: Test
        run: dotnet test src --configuration Release --no-build --no-restore --report-trx
      - name: Upload received snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received
          path: '**/*.received.*'
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: nugets/*.nupkg
      # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
      # policy naming this repository and this workflow file, and returns a key good for an hour —
      # so this stays immediately before the push.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          # The nuget.org account the trusted publishing policy belongs to.
          user: SimonCropp
      - name: Push to nuget.org
        shell: bash
        run: >
          dotnet nuget push nugets/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
