name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src --configuration Release

      # TUnit runs on Microsoft.Testing.Platform (opted into via global.json) and bundles the
      # Microsoft TRX extension, so the flag is --report-trx: the VSTest --logger trx does not apply.
      - name: Test
        run: dotnet test src --configuration Release --no-build --no-restore --report-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore

      - name: Upload snapshot diffs
        # Verify writes .received.* beside the .verified.* baseline when a snapshot differs.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received
          path: '**/*.received.*'
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nugets
          path: nugets/*.nupkg
